<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMN Trace | Demo web</title>
<style>:root{--n:#123047;--t:#007b83;--i:#1e2933;--m:#64717b;--l:#dce5e9;--p:#eef7f7}*{box-sizing:border-box}body{margin:0;background:#f6f8f9;color:var(--i);font:15px Arial,sans-serif}header{background:var(--n);color:#fff;padding:22px 34px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:23px}header small{color:#a8e1df;letter-spacing:.12em}.wrap{max-width:1120px;margin:28px auto;padding:0 20px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.hero h2{color:var(--n);margin:0 0 7px;font-size:27px}.hero p{margin:0;color:var(--m)}.status{color:#176b46;background:#e7f5ee;border-radius:8px;padding:10px 14px;font-size:13px}.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:19px;box-shadow:0 3px 12px #1230470a}.card h3{margin:0 0 15px;color:var(--n)}label{display:block;margin:11px 0 5px;color:var(--m);font-size:12px;font-weight:bold}input,select,textarea{width:100%;border:1px solid #cbd7dc;border-radius:7px;padding:9px;font:inherit}button{border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{width:100%;background:var(--t);color:#fff;margin-top:14px}.secondary{background:var(--p);color:var(--t)}.filters{display:grid;grid-template-columns:1fr 130px 95px;gap:8px;margin-bottom:13px}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:var(--n);color:white;padding:10px 8px}td{border-bottom:1px solid var(--l);padding:10px 8px}tr:hover td{background:#f7fbfb;cursor:pointer}.badge{border-radius:18px;padding:4px 8px;font-size:11px;font-weight:bold}.ok{background:#def5e7;color:#176b46}.nok{background:#fde4e2;color:#a62e29}.pend{background:#fff1ce;color:#7d5b00}.empty{text-align:center;color:var(--m);padding:30px}.detail{display:none;margin-top:16px;background:var(--p);padding:13px;border-radius:8px}.kv{display:grid;grid-template-columns:140px 1fr;gap:5px;font-size:13px}.kv b{color:var(--m)}.small{color:var(--m);font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{display:block}.status{display:inline-block;margin-top:12px}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
</style></head><body><header><h1>AMN Trace <small>DEMO WEB</small></h1><small>TRAZABILIDAD DE INSPECCIÓN</small></header><main class="wrap"><div class="hero"><div><h2>Registro de trazabilidad</h2><p>Demo estática para GitHub Pages.</p></div><div class="status" id="status">● Datos guardados en este navegador</div></div><div class="grid"><section class="card"><h3>Nueva inspección</h3><form id="form"><label>Número de serie *</label><input id="serial" required placeholder="SN-004928184"><label>Número de parte *</label><input id="part" required placeholder="AMN-TSL-000234"><label>Lote / orden</label><input id="lot" placeholder="LOTE-2026 / OP-4812"><label>Línea / estación</label><input id="station" placeholder="Línea 2 / Estación 4"><label>Operador</label><input id="operator" placeholder="Operador turno B"><label>Resultado *</label><select id="result"><option>OK</option><option>NOK</option><option>PENDIENTE</option></select><label>Comentario</label><textarea id="note" rows="2"></textarea><button class="primary">Guardar inspección</button></form><p class="small">Esta demo guarda los datos en localStorage. No sustituye el backend productivo.</p></section><section class="card"><h3>Expedientes recientes</h3><div class="filters"><input id="q" placeholder="Buscar serie, parte, lote u operador"><select id="filter"><option value="">Todos</option><option>OK</option><option>NOK</option><option>PENDIENTE</option></select><button class="secondary" onclick="render()">Actualizar</button></div><div id="table"></div><div id="detail" class="detail"></div></section></div></main>
<script>const key='amn-trace-demo-v1';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let items=JSON.parse(localStorage.getItem(key)||'[]');if(!items.length){items=[{id:'INSP-DEMO-0001',serial:'SN-DEMO-001',part:'AMN-TSL-000234',lot:'LOTE-DEMO',station:'Línea 2 / Estación 4',operator:'Demo',result:'OK',note:'Registro de demostración',at:new Date().toISOString()}];save()}function save(){localStorage.setItem(key,JSON.stringify(items))}function render(){let q=$('q').value.toLowerCase(),f=$('filter').value;let a=items.filter(x=>(!f||x.result===f)&&(!q||[x.serial,x.part,x.lot,x.operator].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.at.localeCompare(a.at));$('table').innerHTML=a.length?'<table><thead><tr><th>Pieza</th><th>Resultado</th><th>Fecha/hora</th><th>Contexto</th></tr></thead><tbody>'+a.map(x=>`<tr onclick="show('${x.id}')"><td><b>${esc(x.serial)}</b><br><span class="small">${esc(x.part)}</span></td><td><span class="badge ${x.result==='OK'?'ok':x.result==='NOK'?'nok':'pend'}">${x.result}</span></td><td>${esc(x.at.replace('T',' ').replace('Z',''))}</td><td>${esc(x.station||'-')}<br><span class="small">${esc(x.operator||'-')}</span></td></tr>`).join('')+'</tbody></table>':'<div class="empty">No hay registros que coincidan.</div>'}function show(id){let x=items.find(v=>v.id===id);$('detail').style.display='block';$('detail').innerHTML=`<div class="kv"><b>ID de evento</b><span>${esc(x.id)}</span><b>Lote / orden</b><span>${esc(x.lot||'-')}</span><b>Comentario</b><span>${esc(x.note||'-')}</span><b>Auditoría</b><span>Creado localmente · ${esc(x.at.replace('T',' ').replace('Z',''))}</span></div>`}$('q').oninput=render;$('filter').onchange=render;$('form').onsubmit=e=>{e.preventDefault();let x={id:'INSP-'+Date.now(),serial:$('serial').value.trim(),part:$('part').value.trim(),lot:$('lot').value.trim(),station:$('station').value.trim(),operator:$('operator').value.trim(),result:$('result').value,note:$('note').value.trim(),at:new Date().toISOString()};items.push(x);save();e.target.reset();$('status').textContent='● Registro guardado localmente';render();show(x.id)};render()</script></body></html>
